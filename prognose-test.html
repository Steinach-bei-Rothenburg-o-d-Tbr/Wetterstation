<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wettervorhersage Gallmersgarten</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; text-align: center; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .forecast-day { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .forecast-day:last-child { border: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wetter Höhenweg 16</h1>
        <p>91605 Gallmersgarten</p>
        <div id="weather">Lädt Wetterdaten...</div>
    </div>

    <script>
        // Koordinaten für Höhenweg 16, 91605 Gallmersgarten
        const lat = 49.4497;
        const lon = 10.2635;
        const days = 7; // Ändere diese Zahl für mehr oder weniger Tage (z.B. 3, 5, 10)

        const url = `https://open-meteo.com{lat}&longitude=${lon}&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=${days}`;

        async function fetchWeather() {
            try {
                const response = await fetch(url);
                const data = await response.json();
                displayWeather(data);
            } catch (error) {
                document.getElementById('weather').innerText = 'Fehler beim Laden der Wetterdaten.';
                console.error(error);
            }
        }

        function displayWeather(data) {
            const weatherDiv = document.getElementById('weather');
            weatherDiv.innerHTML = ''; 

            data.daily.time.forEach((date, index) => {
                const maxTemp = data.daily.temperature_2m_max[index];
                const minTemp = data.daily.temperature_2m_min[index];
                const rainProb = data.daily.precipitation_probability_max[index];

                // Datum lesbar formatieren (z.B. Mo., 15.06.)
                const formattedDate = new Date(date).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });

                const dayEl = document.createElement('div');
                dayEl.className = 'forecast-day';
                dayEl.innerHTML = `
                    <strong>${formattedDate}</strong>
                    <span>Max: ${maxTemp}°C / Min: ${minTemp}°C</span>
                    <span>💧 ${rainProb}%</span>
                `;
                weatherDiv.appendChild(dayEl);
            });
        }

        fetchWeather();
    </script>
</body>
</html>
