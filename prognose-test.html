<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wettervorhersage Gallmersgarten</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f0f4f8; text-align: center; padding: 20px; color: #333; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        h1 { margin-bottom: 5px; color: #0056b3; }
        .subtitle { color: #666; margin-top: 0; margin-bottom: 25px; }
        .forecast-day { display: flex; justify-content: space-between; align-items: center; padding: 12px 10px; border-bottom: 1px solid #eee; }
        .forecast-day:last-child { border: none; }
        .date { font-weight: bold; width: 90px; text-align: left; }
        .icon { font-size: 1.5rem; width: 40px; text-align: center; }
        .temp { width: 180px; text-align: center; }
        .rain { width: 70px; text-align: right; color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Wetter Höhenweg 16</h1>
        <p class="subtitle">91605 Gallmersgarten</p>
        <div id="weather">Lädt aktuelle Wetterdaten von Open-Meteo...</div>
    </div>

    <script>
        // Koordinaten für Höhenweg 16, 91605 Gallmersgarten
        const lat = 49.4497;
        const lon = 10.2635;
        const days = 7; // Hier die Anzahl der gewünschten Vorhersagetage eintragen (z. B. 3, 5, 7, 10)

        // API URL mit Wettercode (weather_code) für Symbole
        const url = `https://open-meteo.com{lat}&longitude=${lon}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin&forecast_days=${days}`;

        // Funktion zur Bestimmung des passenden Emojis anhand des WMO-Wettercodes
        function getWeatherEmoji(code) {
            if (code === 0) return "☀️"; // Klarer Himmel
            if (code >= 1 && code <= 3) return "⛅"; // Leicht bewölkt
            if (code >= 45 && code <= 48) return "🌫️"; // Nebel
            if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) return "🌧️"; // Regen
            if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return "❄️"; // Schnee
            if (code >= 95 && code <= 99) return "⛈️"; // Gewitter
            return "☁️"; // Bedeckt / Unbekannt
        }

        async function fetchWeather() {
            try {
                const response = await fetch(url);
                if (!response.ok) throw new Error('Netzwerk-Antwort war nicht ok');
                const data = await response.json();
                displayWeather(data);
            } catch (error) {
                document.getElementById('weather').innerText = 'Fehler beim Laden der Wetterdaten. Bitte versuche es später erneut.';
                console.error(error);
            }
        }

        function displayWeather(data) {
            const weatherDiv = document.getElementById('weather');
            weatherDiv.innerHTML = ''; 

            data.daily.time.forEach((date, index) => {
                const maxTemp = Math.round(data.daily.temperature_2m_max[index]);
                const minTemp = Math.round(data.daily.temperature_2m_min[index]);
                const rainProb = data.daily.precipitation_probability_max[index];
                const weatherCode = data.daily.weather_code[index];
                
                // Emoji bestimmen
                const emoji = getWeatherEmoji(weatherCode);

                // Datum für deutsche Anzeige formatieren (z.B. Mo., 15.06.)
                const formattedDate = new Date(date).toLocaleDateString('de-DE', { weekday: 'short', day: '2-digit', month: '2-digit' });

                // HTML-Element für den Tag erstellen
                const dayEl = document.createElement('div');
                dayEl.className = 'forecast-day';
                dayEl.innerHTML = `
                    <div class="date">${formattedDate}</div>
                    <div class="icon">${emoji}</div>
                    <div class="temp">Max: ${maxTemp}°C / Min: ${minTemp}°C</div>
                    <div class="rain">💧 ${rainProb}%</div>
                `;
                weatherDiv.appendChild(dayEl);
            });
        }

        // Wetterabfrage beim Laden der Seite starten
        fetchWeather();
    </script>
</body>
</html>
