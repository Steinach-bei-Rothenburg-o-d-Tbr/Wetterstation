            }}

            // --- PROGNOSE LOGIK ---
            const url = 'https://api.open-meteo.com/v1/forecast?latitude=49.4554&longitude=10.2776&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin';

            async function fetchWeather() {{
