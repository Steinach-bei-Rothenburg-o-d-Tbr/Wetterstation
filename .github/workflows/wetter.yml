name: Wetter-Webseite bauen und deployen

on:
  repository_dispatch:
    types:
      - wetter_update
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Wettervorhersage direkt von Open-Meteo abrufen
        run: |
          curl -s "https://api.open-meteo.com/v1/forecast?latitude=49.4554&longitude=10.2776&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FBerlin" > forecast.json

      - name: Wetterdaten in wetterapi.json schreiben
        run: |
          cat <<EOF > wetterapi.json
          {
            "station": "Bastians Wetterstation Steinach",
            "stand": "${{ github.event.client_payload.zeit }}",
            "messwerte": {
              "temperatur_celsius": "${{ github.event.client_payload.temperatur }}",
              "luftfeuchtigkeit_prozent": "${{ github.event.client_payload.luftfeuchtigkeit }}",
              "windgeschwindigkeit_kmh": "${{ github.event.client_payload.windgeschwindigkeit }}",
              "boengeschwindigkeit_kmh": "${{ github.event.client_payload.boengeschwindigkeit }}",
              "windrichtung": "${{ github.event.client_payload.windrichtung }}",
              "luftdruck_hpa": "${{ github.event.client_payload.druck }}",
              "uv_index": "${{ github.event.client_payload.uv_index }}",
              "helligkeit_lux": "${{ github.event.client_payload.beleuchtungsstarke }}"
            },
            "niederschlag_lm2": {
              "heute": "${{ github.event.client_payload.regen_heute }}",
              "aktueller_monat": "1.6",
              "aktuelles_jahr": "1.6"
            },
            "vorhersage": $(cat forecast.json)
          }
          EOF

      - name: Änderungen speichern (Commit & Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wetterapi.json
          git commit -m "Wetterdaten und Vorhersage aktualisiert" || echo "Keine Änderungen zum Speichern"
          git push

      - name: GitHub Pages einrichten
        uses: actions/configure-pages@v4

      - name: Webseite als Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
