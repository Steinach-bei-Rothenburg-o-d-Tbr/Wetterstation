name: Wetterdaten aktualisieren

on:
  repository_dispatch:
    types: [wetter_update]

permissions:
  contents: write

jobs:
  update-wetter:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          ref: main 

      - name: Wetterdaten aktualisieren
        env:
          ZEIT: ${{ github.event.client_payload.wetterdaten.zeit }}
          TEMPERATUR: ${{ github.event.client_payload.wetterdaten.temperatur }}
          FEUCHTIGKEIT: ${{ github.event.client_payload.wetterdaten.luftfeuchtigkeit }}
          WIND: ${{ github.event.client_payload.wetterdaten.windgeschwindigkeit }}
          BOE: ${{ github.event.client_payload.wetterdaten.boengeschwindigkeit }}
          RICHTUNG: ${{ github.event.client_payload.wetterdaten.windrichtung }}
          DRUCK: ${{ github.event.client_payload.wetterdaten.druck }}
          UV: ${{ github.event.client_payload.wetterdaten.uv_index }}
          HELLIGKEIT: ${{ github.event.client_payload.wetterdaten.beleuchtungsstarke }}
          REGEN_HEUTE: ${{ github.event.client_payload.wetterdaten.regen_heute }}
          REGEN_MONAT: ${{ github.event.client_payload.wetterdaten.regen_monat }}
          REGEN_JAHR: ${{ github.event.client_payload.wetterdaten.regen_jahr }}
        run: |
          # Erstellt ein valides JSON via jq, um Syntaxfehler im Browser zu verhindern
          jq -n \
            --arg station "Bastians Wetterstation Steinach" \
            --arg stand "$ZEIT" \
            --arg temp "$TEMPERATUR" \
            --arg feucht "$FEUCHTIGKEIT" \
            --arg wind "$WIND" \
            --arg boe "$BOE" \
            --arg richtung "$RICHTUNG" \
            --arg druck "$DRUCK" \
            --arg uv "$UV" \
            --arg hell "$HELLIGKEIT" \
            --arg heute "$REGEN_HEUTE" \
            --arg monat "$REGEN_MONAT" \
            --arg jahr "$REGEN_JAHR" \
            '{
              station: $station,
              stand: $stand,
              messwerte: {
                temperatur_celsius: ($temp | tonumber? // $temp),
                luftfeuchtigkeit_prozent: ($feucht | tonumber? // $feucht),
                windgeschwindigkeit_kmh: ($wind | tonumber? // $wind),
                boengeschwindigkeit_kmh: ($boe | tonumber? // $boe),
                windrichtung: $richtung,
                luftdruck_hpa: ($druck | tonumber? // $druck),
                uv_index: ($uv | tonumber? // $uv),
                helligkeit_lux: ($hell | tonumber? // $hell)
              },
              niederschlag_lm2: {
                heute: ($heute | tonumber? // $heute),
                aktueller_monat: ($monat | tonumber? // $monat),
                aktuelles_jahr: ($jahr | tonumber? // $jahr)
              }
            }' > wetterapi.json

      - name: Änderungen committen und pushen
        env:
          ZEIT: ${{ github.event.client_payload.wetterdaten.zeit }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add wetterapi.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Keine Änderungen an den Wetterdaten."
          else
            git commit -m "Wetterdaten aktualisiert: $ZEIT"
            git push origin main
          fi
