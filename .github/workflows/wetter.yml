name: Wetter-Webseite bauen und deployen

on:
  repository_dispatch:
    types:
      - wetter_update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Wetterseite erzeugen und veröffentlichen
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Empfangene Wetterdaten anzeigen
        env:
          TEMPERATUR: ${{ github.event.client_payload.temperatur }}
          LUFTFEUCHTIGKEIT: ${{ github.event.client_payload.luftfeuchtigkeit }}
          WINDGESCHWINDIGKEIT: ${{ github.event.client_payload.windgeschwindigkeit }}
          BOENGESCHWINDIGKEIT: ${{ github.event.client_payload.boengeschwindigkeit }}
          WINDRICHTUNG: ${{ github.event.client_payload.windrichtung }}
          LUFTDRUCK: ${{ github.event.client_payload.druck }}
          UV_INDEX: ${{ github.event.client_payload.uv_index }}
          HELLIGKEIT: ${{ github.event.client_payload.beleuchtungsstarke }}
          REGEN_HEUTE: ${{ github.event.client_payload.regen_heute }}
          REGENVIERZEHNTAGE: ${{ github.event.client_payload.regenvierzehntage }}
          REGENMONAT: ${{ github.event.client_payload.regenmonat }}
          REGENJAHR: ${{ github.event.client_payload.regenjahr }}
          ZEIT: ${{ github.event.client_payload.zeit }}
        run: |
          echo "Auslöser: '${{ github.event_name }}'"
          echo "Temperatur: '$TEMPERATUR'"
          echo "Luftfeuchtigkeit: '$LUFTFEUCHTIGKEIT'"
          echo "Windgeschwindigkeit: '$WINDGESCHWINDIGKEIT'"
          echo "Boengeschwindigkeit: '$BOENGESCHWINDIGKEIT'"
          echo "Windrichtung: '$WINDRICHTUNG'"
          echo "Luftdruck: '$LUFTDRUCK'"
          echo "UV-Index: '$UV_INDEX'"
          echo "Helligkeit: '$HELLIGKEIT'"
          echo "Regen heute: '$REGEN_HEUTE'"
          echo "Regen 14 Tage: '$REGENVIERZEHNTAGE'"
          echo "Regen Monat: '$REGENMONAT'"
          echo "Regen Jahr: '$REGENJAHR'"
          echo "Zeit: '$ZEIT'"

      - name: Veröffentlichungsordner vorbereiten
        run: |
          rm -rf public
          mkdir -p public

          if [ -d "css" ]; then
            cp -r css public/css
          fi

          if [ -d "projekte" ]; then
            cp -r projekte public/projekte
          fi

      - name: HTML-Datei mit Wetterwerten erstellen
        env:
          TEMPERATUR: ${{ github.event.client_payload.temperatur || '--' }}
          LUFTFEUCHTIGKEIT: ${{ github.event.client_payload.luftfeuchtigkeit || '--' }}
          WINDGESCHWINDIGKEIT: ${{ github.event.client_payload.windgeschwindigkeit || '--' }}
          BOENGESCHWINDIGKEIT: ${{ github.event.client_payload.boengeschwindigkeit || '--' }}
          WINDRICHTUNG: ${{ github.event.client_payload.windrichtung || '--' }}
          LUFTDRUCK: ${{ github.event.client_payload.druck || '--' }}
          UV_INDEX: ${{ github.event.client_payload.uv_index || '--' }}
          HELLIGKEIT: ${{ github.event.client_payload.beleuchtungsstarke || '--' }}
          REGEN_HEUTE: ${{ github.event.client_payload.regen_heute || '0.0' }}
          REGENVIERZEHNTAGE: ${{ github.event.client_payload.regenvierzehntage || '0.0' }}
          REGENMONAT: ${{ github.event.client_payload.regenmonat || '0.0' }}
          REGENJAHR: ${{ github.event.client_payload.regenjahr || '0.0' }}
          ZEIT: ${{ github.event.client_payload.zeit || 'Keine Aktualisierungszeit vorhanden' }}
        run: |
          python3 <<'PY'
          import html
          import os
          from pathlib import Path

          def wert(name, standard):
              inhalt = os.environ.get(name, "").strip()
              if not inhalt:
                  inhalt = standard
              return html.escape(inhalt, quote=True)

          temperatur = wert("TEMPERATUR", "--")
          luftfeuchtigkeit = wert("LUFTFEUCHTIGKEIT", "--")
          windgeschwindigkeit = wert("WINDGESCHWINDIGKEIT", "--")
          boengeschwindigkeit = wert("BOENGESCHWINDIGKEIT", "--")
          windrichtung = wert("WINDRICHTUNG", "--")
          luftdruck = wert("LUFTDRUCK", "--")
          uv_index = wert("UV_INDEX", "--")
          helligkeit = wert("HELLIGKEIT", "--")
          regen_heute = wert("REGEN_HEUTE", "0.0")
          regen_14_tage = wert("REGENVIERZEHNTAGE", "0.0")
          regen_monat = wert("REGENMONAT", "0.0")
          regen_jahr = wert("REGENJAHR", "0.0")
          zeit = wert("ZEIT", "Keine Aktualisierungszeit vorhanden")

          seite = f"""<!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <meta name="description" content="Aktuelle Wetterdaten aus Steinach bei Rothenburg ob der Tauber">
            <title>Bastians Wetterstation | Steinach bei Rothenburg</title>
            css/style.css
          </head>

          <body>
            <main class="card">
              <h1>🌦 Bastians Wetterstation</h1>

              <div class="ort">
                📍 Steinach bei Rothenburg ob der Tauber
              </div>

              <div class="temp">
                {temperatur} °C
              </div>

              <div class="grid">
                <div class="info">
                  <div class="label">💧 Luftfeuchtigkeit</div>
                  <div class="value">{luftfeuchtigkeit} %</div>
                </div>

                <div class="info">
                  <div class="label">🌬 Wind</div>
                  <div class="value">{windgeschwindigkeit} km/h</div>
                </div>

                <div class="info">
                  <div class="label">🌪 Böen</div>
                  <div class="value">{boengeschwindigkeit} km/h</div>
                </div>

                <div class="info">
                  <div class="label">🧭 Windrichtung</div>
                  <div class="value">{windrichtung}</div>
                </div>

                <div class="info">
                  <div class="label">📈 Luftdruck</div>
                  <div class="value">{luftdruck} hPa</div>
                </div>

                <div class="info">
                  <div class="label">☀️ UV-Index</div>
                  <div class="value">{uv_index}</div>
                </div>

                <div class="info">
                  <div class="label">💡 Helligkeit</div>
                  <div class="value">{helligkeit} lx</div>
                </div>

                <div class="info">
                  <div class="label">🌧 Regen heute</div>
                  <div class="value">{regen_heute} L/m²</div>
                </div>

                <div class="info">
                  <div class="label">📅 Regen 14 Tage</div>
                  <div class="value">{regen_14_tage} L/m²</div>
                </div>

                <div class="info">
                  <div class="label">📅 Regen Monat</div>
                  <div class="value">{regen_monat} L/m²</div>
                </div>

                <div class="info" style="grid-column: span 2;">
                  <div class="label">📅 Regen dieses Jahr</div>
                  <div class="value">{regen_jahr} L/m²</div>
                </div>
              </div>

              <div class="projekte">
                <h2>🚀 Weitere Projekte</h2>
                projekte/Wetterstation.html
                  🌦 Wetterstation
                </a>
              </div>

              <div class="stand">
                🕒 {zeit}
              </div>
            </main>
          </body>
          </html>
          """

          ziel = Path("public/index.html")
          ziel.write_text(seite, encoding="utf-8")

          print("public/index.html wurde erstellt.")
          print(f"Regen 14 Tage: {regen_14_tage}")
          print(f"Regen Monat: {regen_monat}")
          print(f"Regen Jahr: {regen_jahr}")
          PY

      - name: Erzeugte Wetterseite prüfen
        run: |
          if [ ! -s "public/index.html" ]; then
            echo "Fehler: public/index.html fehlt oder ist leer."
            exit 1
          fi

          if grep -Fq '$TEMPERATUR' public/index.html; then
            echo "Fehler: Es befinden sich noch Platzhalter in der HTML-Datei."
            exit 1
          fi

          if grep -Fq '&lt;' public/index.html; then
            echo "Fehler: HTML-Zeichen wurden falsch gespeichert."
            exit 1
          fi

          echo "Gefundene Regenwerte:"
          grep -A1 "Regen 14 Tage" public/index.html || true
          grep -A1 "Regen Monat" public/index.html || true
          grep -A1 "Regen dieses Jahr" public/index.html || true

          echo "Die Wetterseite wurde erfolgreich erzeugt."

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Webseiten-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
``
