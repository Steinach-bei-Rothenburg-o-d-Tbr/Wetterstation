name: Wetterdaten aktualisieren

on:
  repository_dispatch:
    types: [wetter_update]

permissions:
  contents: write

jobs:
  update-wetter:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          ref: main 

      - name: Wetterdaten aktualisieren
        run: |
          cat << EOF > wetterapi.json
          {
            "station": "Bastians Wetterstation Steinach",
            "stand": "${{ github.event.client_payload.zeit }}",
            "messwerte": {
              "temperatur_celsius": ${{ github.event.client_payload.temperatur }},
              "luftfeuchtigkeit_prozent": ${{ github.event.client_payload.luftfeuchtigkeit }},
              "windgeschwindigkeit_kmh": ${{ github.event.client_payload.windgeschwindigkeit }},
              "boengeschwindigkeit_kmh": ${{ github.event.client_payload.boengeschwindigkeit }},
              "windrichtung": "${{ github.event.client_payload.windrichtung }}",
              "luftdruck_hpa": ${{ github.event.client_payload.druck }},
              "uv_index": ${{ github.event.client_payload.uv_index }},
              "helligkeit_lux": ${{ github.event.client_payload.beleuchtungsstarke }}
            },
            "niederschlag_lm2": {
              "heute": ${{ github.event.client_payload.regen_heute }},
              "aktueller_monat": ${{ github.event.client_payload.regen_monat }},
              "aktuelles_jahr": ${{ github.event.client_payload.regen_jahr }}
            }
          }
          EOF

      - name: Änderungen committen und pushen
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add wetterapi.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Keine Änderungen an den Wetterdaten."
          else
            git commit -m "Wetterdaten aktualisiert: ${{ github.event.client_payload.zeit }}"
            git push origin main
          fi
