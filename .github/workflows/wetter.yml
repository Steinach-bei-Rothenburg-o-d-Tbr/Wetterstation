name: Wetter-Webseite bauen und deployen

on:
  repository_dispatch:
    types:
      - wetter_update
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: HTML und API-JSON erstellen
        run: |
          # Fallbacks einrichten, falls manuell (workflow_dispatch) ohne Daten gestartet wurde
          TEMP="${{ github.event.client_payload.temperatur || 'Keine Daten' }}"
          HUMID="${{ github.event.client_payload.luftfeuchtigkeit || '0' }}"
          WIND="${{ github.event.client_payload.windgeschwindigkeit || '0' }}"
          BOEEN="${{ github.event.client_payload.boengeschwindigkeit || '0' }}"
          RICHTUNG="${{ github.event.client_payload.windrichtung || 'N/A' }}"
          DRUCK="${{ github.event.client_payload.druck || '0' }}"
          UV="${{ github.event.client_payload.uv_index || '0' }}"
          LUX="${{ github.event.client_payload.beleuchtungsstarke || '0' }}"
          REGEN_H="${{ github.event.client_payload.regen_heute || '0' }}"
          REGEN_14="${{ github.event.client_payload.regenvierzehntage || '0' }}"
          REGEN_M="${{ github.event.client_payload.regenmonat || '0' }}"
          REGEN_J="${{ github.event.client_payload.regenjahr || '0' }}"
          ZEIT="${{ github.event.client_payload.zeit || 'Unbekannte Zeit' }}"

          # 1. Die normale Webseite für Besucher bauen
          cat > index.html << EOF
          <!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Bastians Wetterstation | Steinach bei Rothenburg</title>
            <link rel="stylesheet" href="css/style.css">
          </head>
          <body>
            <div class="card">
              <h1> Adil 🌦 Bastians Wetterstation</h1>
              <div class="ort">📍 Steinach bei Rothenburg ob der Tauber</div>
              <div class="temp">$TEMP °C</div>
              <div class="grid">
                <div class="info"><div class="label">💧 Luftfeuchtigkeit</div><div class="value">$HUMID %</div></div>
                <div class="info"><div class="label">🌬 Wind</div><div class="value">$WIND km/h</div></div>
                <div class="info"><div class="label">🌪 Böen</div><div class="value">$BOEEN km/h</div></div>
                <div class="info"><div class="label">🧭 Windrichtung</div><div class="value">$RICHTUNG</div></div>
                <div class="info"><div class="label">📈 Luftdruck</div><div class="value">$DRUCK hPa</div></div>
                <div class="info"><div class="label">☀️ UV-Index</div><div class="value">$UV</div></div>
                <div class="info"><div class="label">💡 Helligkeit</div><div class="value">$LUX lx</div></div>
                <div class="info" onclick="toggleRegenDetails()" title="Klicken für Details" style="grid-column: span 1;">
                  <div class="label">🌧 Regen heute ▾</div>
                  <div class="value">$REGEN_H L/m²</div>
                  <div id="regen-details" style="display: none; margin-top: 15px; padding-top: 10px; border-top: 1px solid #ddd; text-align: left; font-size: 15px; line-height: 1.6;">
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;"><span>📅 14 Tage:</span> <strong>$REGEN_14 L/m²</strong></div>
                    <div style="display: flex; justify-content: space-between; margin-bottom: 5px;"><span>📅 Monat:</span> <strong>$REGEN_M L/m²</strong></div>
                    <div style="display: flex; justify-content: space-between;"><span>📅 Jahr:</span> <strong>$REGEN_J L/m²</strong></div>
                  </div>
                </div>
              </div>
              <div class="projekte"><h2>🚀 Weitere Projekte</h2><a href="Wetterstation.html" class="projekt-link">🌦 Wetterstation</a></div>
              <div class="stand">🕒 $ZEIT</div>
            </div>
            <script>
            function toggleRegenDetails() {
              var details = document.getElementById("regen-details");
              details.style.display = details.style.display === "none" ? "block" : "none";
            }
            </script>
          </body>
          </html>
          EOF

          # 2. Die API-DATEI generieren
          cat > wetterapi.json << EOF
          {
            "station": "Bastians Wetterstation Steinach",
            "stand": "$ZEIT",
            "messwerte": {
              "temperatur_celsius": "$TEMP",
              "luftfeuchtigkeit_prozent": "$HUMID",
              "windgeschwindigkeit_kmh": "$WIND",
              "boengeschwindigkeit_kmh": "$BOEEN",
              "windrichtung": "$RICHTUNG",
              "luftdruck_hpa": "$DRUCK",
              "uv_index": "$UV",
              "helligkeit_lux": "$LUX"
            },
            "niederschlag_lm2": {
              "heute": "$REGEN_H",
              "letzte_vierzehn_tage": "$REGEN_14",
              "aktueller_monat": "$REGEN_M",
              "aktuelles_jahr": "$REGEN_J"
            }
          }
          EOF
          
      - name: Webseiten-Ordner für Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Änderungen im Repository speichern
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add index.html wetterapi.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Wetterdaten aktualisiert: ${{ github.event.client_payload.zeit }}" && git push)

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
