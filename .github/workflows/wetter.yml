name: Wetter-Webseite bauen und deployen

on:
  repository_dispatch:
    types:
      - wetter_update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Debug Payload
        run: |
          echo "Temperatur='${{ github.event.client_payload.temperatur }}'"
          echo "Regen heute='${{ github.event.client_payload.regen_heute }}'"
          echo "Regen 14 Tage='${{ github.event.client_payload.regenvierzehntage }}'"
          echo "Regen Monat='${{ github.event.client_payload.regenmonat }}'"
          echo "Regen Jahr='${{ github.event.client_payload.regenjahr }}'"
          echo "Zeit='${{ github.event.client_payload.zeit }}'"

      - name: HTML erzeugen
        env:
          TEMPERATUR: ${{ github.event.client_payload.temperatur }}
          REGEN_HEUTE: ${{ github.event.client_payload.regen_heute }}
          REGENVIERZEHNTAGE: ${{ github.event.client_payload.regenvierzehntage }}
          REGENMONAT: ${{ github.event.client_payload.regenmonat }}
          REGENJAHR: ${{ github.event.client_payload.regenjahr }}
          ZEIT: ${{ github.event.client_payload.zeit }}
        run: |
          cat > index.html <<EOF
          <!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8">
            <title>Test</title>
          </head>
          <body>
            <h1>TEST</h1>

            Temperatur: $TEMPERATUR<br>
            Regen heute: $REGEN_HEUTE<br>
            Regen 14 Tage: $REGENVIERZEHNTAGE<br>
            Regen Monat: $REGENMONAT<br>
            Regen Jahr: $REGENJAHR<
