name: Wetterdaten aktualisieren

on:
  repository_dispatch:
    types: [wetter_update]

permissions:
  contents: write

jobs:
  update-wetter:
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4
        with:
          ref: main 

      - name: Wetterdaten aktualisieren
        env:
          ZEIT: ${{ github.event.client_payload.zeit }}
          TEMPERATUR: ${{ github.event.client_payload.temperatur }}
          FEUCHTIGKEIT: ${{ github.event.client_payload.luftfeuchtigkeit }}
          WIND: ${{ github.event.client_payload.windgeschwindigkeit }}
          BOE: ${{ github.event.client_payload.boengeschwindigkeit }}
          RICHTUNG: ${{ github.event.client_payload.windrichtung }}
          DRUCK: ${{ github.event.client_payload.druck }}
          UV: ${{ github.event.client_payload.uv_index }}
          HELLIGKEIT: ${{ github.event.client_payload.beleuchtungsstarke }}
          REGEN_HEUTE: ${{ github.event.client_payload.regen_heute }}
          REGEN_MONAT: ${{ github.event.client_payload.regen_monat }}
          REGEN_JAHR: ${{ github.event.client_payload.regen_jahr }}
        run: |
          cat << EOF > wetterapi.json
          {
            "station": "Bastians Wetterstation Steinach",
            "stand": "$ZEIT",
            "messwerte": {
              "temperatur_celsius": $TEMPERATUR,
              "luftfeuchtigkeit_prozent": $FEUCHTIGKEIT,
              "windgeschwindigkeit_kmh": $WIND,
              "boengeschwindigkeit_kmh": $BOE,
              "windrichtung": "$RICHTUNG",
              "luftdruck_hpa": $DRUCK,
              "uv_index": $UV,
              "helligkeit_lux": $HELLIGKEIT
            },
            "niederschlag_lm2": {
              "heute": $REGEN_HEUTE,
              "aktueller_monat": $REGEN_MONAT,
              "aktuelles_jahr": $REGEN_JAHR
            }
          }
          EOF

      - name: Änderungen committen und pushen
        env:
          ZEIT: ${{ github.event.client_payload.zeit }}
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add wetterapi.json
          if git diff --quiet && git diff --staged --quiet; then
            echo "Keine Änderungen an den Wetterdaten."
          else
            git commit -m "Wetterdaten aktualisiert: $ZEIT"
            git push origin main
          fi
