name: Wetter-Webseite bauen und deployen

on:
  repository_dispatch:
    types:
      - wetter_update
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Wetterdaten verarbeiten und alle Dateien schreiben
        shell: python
        run: |
          import json
          import os
          import urllib.request
          from datetime import datetime

          # 1. Daten vom Home Assistant Webhook holen
          temp = "${{ github.event.client_payload.temperatur || '0' }}"
          humid = "${{ github.event.client_payload.luftfeuchtigkeit || '0' }}"
          wind = "${{ github.event.client_payload.windgeschwindigkeit || '0' }}"
          boeen = "${{ github.event.client_payload.boengeschwindigkeit || '0' }}"
          richtung = "${{ github.event.client_payload.windrichtung || 'N/A' }}"
          druck = "${{ github.event.client_payload.druck || '0' }}"
          uv = "${{ github.event.client_payload.uv_index || '0' }}"
          lux = "${{ github.event.client_payload.beleuchtungsstarke || '0' }}"
          regen_heute = float("${{ github.event.client_payload.regen_heute || '0' }}")
          zeit_neu = "${{ github.event.client_payload.zeit || 'Unbekannt' }}"

          # 2. Langzeit-Regenwerte verarbeiten
          regen_m = 1.6  
          regen_j = 1.6  

          if os.path.exists("wetterapi.json"):
              with open("wetterapi.json", "r") as f:
                  try:
                      old_data = json.load(f)
                      regen_m = float(old_data["niederschlag_lm2"]["aktueller_monat"])
                      regen_j = float(old_data["niederschlag_lm2"]["aktuelles_jahr"])
                      old_heute = float(old_data["niederschlag_lm2"]["heute"])

                      if regen_heute > old_heute:
                          differenz = regen_heute - old_heute
                          regen_m += differenz
                          regen_j += differenz
                      elif regen_heute < old_heute:
                          regen_m += regen_heute
                          regen_j += regen_heute
                  except:
                      pass

          # 3. Wetterprognose von Open-Meteo laden (Koordinaten: Steinach)
          prognose_liste = []
          try:
              url = "https://open-meteo.com"
              with urllib.request.urlopen(url) as response:
                  forecast_data = json.loads(response.read().decode())
                  
                  def get_wetter_text(code):
                      c = int(code)
                      if c == 0: return "☀️", "Klar"
                      elif c in: return "⛅", "Bewölkt"
                      elif c in: return "🌫️", "Nebel"
                      elif c in: return "🌧️", "Regen"
                      elif c in: return "🌨️", "Schnee"
                      elif c in: return "⛈️", "Gewitter"
                      return "✨", "Wechselhaft"

                  daily = forecast_data["daily"]
                  for i in range(3):
                      emoji, text = get_wetter_text(daily["weather_code"][i])
                      # Datum formatieren (YYYY-MM-DD -> DD.MM.)
                      d_parts = daily["time"][i].split("-")
                      date_formatted = f"{d_parts[2]}.{d_parts[1]}."
                      
                      prognose_liste.append({
                          "datum": date_formatted,
                          "emoji": emoji,
                          "zustand": text,
                          "temp_max": float(daily["temperature_2m_max"][i]),
                          "temp_min": float(daily["temperature_2m_min"][i])
                      })
          except Exception as e:
              prognose_liste = [{"datum": "N/A", "emoji": "❌", "zustand": "Fehler", "temp_max": 0.0, "temp_min": 0.0} for _ in range(3)]

          # 4. wetterapi.json schreiben
          api_data = {
              "station": "Bastians Wetterstation Steinach",
              "stand": zeit_neu,
              "messwerte": {
                  "temperatur_celsius": temp,
                  "luftfeuchtigkeit_prozent": humid,
                  "windgeschwindigkeit_kmh": wind,
                  "boengeschwindigkeit_kmh": boeen,
                  "windrichtung": richtung,
                  "luftdruck_hpa": druck,
                  "uv_index": uv,
                  "helligkeit_lux": lux
              },
              "niederschlag_lm2": {
                  "heute": str(round(regen_heute, 1)),
                  "aktueller_monat": str(round(regen_m, 1)),
                  "aktuelles_jahr": str(round(regen_j, 1))
              },
              "prognose_3_tage": prognose_liste
          }

          with open("wetterapi.json", "w") as f:
              json.dump(api_data, f, indent=2)

          # 5. HTML-Webseite (index.html) direkt in Python bauen
          html_content = f"""<!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Bastians Wetterstation | Steinach bei Rothenburg</title>
            <link rel="stylesheet" href="css/style.css">
          </head>
          <body>
            <div class="card">
              <h1>🌦 Bastians Wetterstation</h1>
              <div class="ort">📍 Steinach bei Rothenburg ob der Tauber</div>
              <div class="temp">{temp} °C</div>
              <div class="grid">
                <div class="info"><div class="label">💧 Luftfeuchtigkeit</div><div class="value">{humid} %</div></div>
                <div class="info"><div class="label">🌬 Wind</div><div class="value">{wind} km/h</div></div>
                <div class="info"><div class="label">🌪 Böen</div><div class="value">{boeen} km/h</div></div>
                <div class="info"><div class="label">🧭 Windrichtung</div><div class="value">{richtung}</div></div>
                <div class="info"><div class="label">📈 Luftdruck</div><div class="value">{druck} hPa</div></div>
                <div class="info"><div class="label">☀️ UV-Index</div><div class="value">{uv}</div></div>
                <div class="info"><div class="label">💡 Helligkeit</div><div class="value">{lux} lx</div></div>
                <div class="info" onclick="openModal()" title="Klicken für Details" style="grid-column: span 1;">
                  <div class="label">🌧 Regen heute ▾</div>
                  <div class="value">{round(regen_heute, 1)} L/m²</div>
                </div>
              </div>
              
              <!-- 3-TAGE-PROGNOSE (GANZ UNTEN) -->
              <div class="projekte" style="margin-top: 25px;">
                <h2>🔮 3-Tage-Vorhersage (Steinach)</h2>
                <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px;">
                  <div style="background: #f7f8fa; padding: 10px; border-radius: 10px; font-size: 14px;">
                    <div style="color: #666; font-weight: bold;">{prognose_liste[0]['datum']}</div>
                    <div style="font-size: 24px; margin: 5px 0;">{prognose_liste[0]['emoji']}</div>
                    <div style="font-weight: bold; color: #ff5722;">{prognose_liste[0]['temp_max']}°</div>
                    <div style="color: #007bff;">{prognose_liste[0]['temp_min']}°</div>
                    <div style="font-size: 11px; color: #777; margin-top: 3px;">{prognose_liste[0]['zustand']}</div>
                  </div>
                  <div style="background: #f7f8fa; padding: 10px; border-radius: 10px; font-size: 14px;">
                    <div style="color: #666; font-weight: bold;">{prognose_liste[1]['datum']}</div>
                    <div style="font-size: 24px; margin: 5px 0;">{prognose_liste[1]['emoji']}</div>
                    <div style="font-weight: bold; color: #ff5722;">{prognose_liste[1]['temp_max']}°</div>
                    <div style="color: #007bff;">{prognose_liste[1]['temp_min']}°</div>
                    <div style="font-size: 11px; color: #777; margin-top: 3px;">{prognose_liste[1]['zustand']}</div>
                  </div>
                  <div style="background: #f7f8fa; padding: 10px; border-radius: 10px; font-size: 14px;">
                    <div style="color: #666; font-weight: bold;">{prognose_liste[2]['datum']}</div>
                    <div style="font-size: 24px; margin: 5px 0;">{prognose_liste[2]['emoji']}</div>
                    <div style="font-weight: bold; color: #ff5722;">{prognose_liste[2]['temp_max']}°</div>
                    <div style="color: #007bff;">{prognose_liste[2]['temp_min']}°</div>
                    <div style="font-size: 11px; color: #777; margin-top: 3px;">{prognose_liste[2]['zustand']}</div>
                  </div>
                </div>
              </div>

              <div class="projekte">
                <h2>🚀 Weitere Projekte</h2>
                <a href="Wetterstation.html" class="projekt-link">🌦 Wetterstation</a>
                <a href="wetterapi.json" class="projekt-link" target="_blank">🌐 Wetter-API (JSON)</a>
              </div>
              <div class="stand">🕒 {zeit_neu}</div>
            </div>

            <!-- MODAL POPUP -->
            <div id="regenModal" class="modal">
              <div class="modal-content">
                <span class="close-btn" onclick="closeModal()">&times;</span>
                <h2>📊 Regen-Statistiken</h2>
                <hr>
