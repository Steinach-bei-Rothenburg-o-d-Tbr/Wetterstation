name: Wetter-Webseite bauen und deployen

on:
  repository_dispatch:
    types:
      - wetter_update
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Wetterseite erzeugen und veröffentlichen
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Empfangene Wetterdaten anzeigen
        env:
          TEMPERATUR: ${{ github.event.client_payload.temperatur }}
          LUFTFEUCHTIGKEIT: ${{ github.event.client_payload.luftfeuchtigkeit }}
          WINDGESCHWINDIGKEIT: ${{ github.event.client_payload.windgeschwindigkeit }}
          BOENGESCHWINDIGKEIT: ${{ github.event.client_payload.boengeschwindigkeit }}
          WINDRICHTUNG: ${{ github.event.client_payload.windrichtung }}
          LUFTDRUCK: ${{ github.event.client_payload.druck }}
          UV_INDEX: ${{ github.event.client_payload.uv_index }}
          HELLIGKEIT: ${{ github.event.client_payload.beleuchtungsstarke }}
          REGEN_HEUTE: ${{ github.event.client_payload.regen_heute }}
          REGENVIERZEHNTAGE: ${{ github.event.client_payload.regenvierzehntage }}
          REGENMONAT: ${{ github.event.client_payload.regenmonat }}
          REGENJAHR: ${{ github.event.client_payload.regenjahr }}
          ZEIT: ${{ github.event.client_payload.zeit }}
        run: |
          echo "Auslöser: '${{ github.event_name }}'"
          echo "Temperatur: '$TEMPERATUR'"
          echo "Luftfeuchtigkeit: '$LUFTFEUCHTIGKEIT'"
          echo "Windgeschwindigkeit: '$WINDGESCHWINDIGKEIT'"
          echo "Boengeschwindigkeit: '$BOENGESCHWINDIGKEIT'"
          echo "Windrichtung: '$WINDRICHTUNG'"
          echo "Luftdruck: '$LUFTDRUCK'"
          echo "UV-Index: '$UV_INDEX'"
          echo "Helligkeit: '$HELLIGKEIT'"
          echo "Regen heute: '$REGEN_HEUTE'"
          echo "Regen 14 Tage: '$REGENVIERZEHNTAGE'"
          echo "Regen Monat: '$REGENMONAT'"
          echo "Regen Jahr: '$REGENJAHR'"
          echo "Zeit: '$ZEIT'"

      - name: Veröffentlichungsordner vorbereiten
        run: |
          rm -rf public
          mkdir -p public

          if [ -d "css" ]; then
            cp -r css public/css
          else
            echo "Hinweis: Der Ordner css wurde nicht gefunden."
          fi

          if [ -d "projekte" ]; then
            cp -r projekte public/projekte
          else
            echo "Hinweis: Der Ordner projekte wurde nicht gefunden."
          fi

      - name: HTML-Datei mit Wetterwerten erstellen
        env:
          TEMPERATUR: ${{ github.event.client_payload.temperatur || '--' }}
          LUFTFEUCHTIGKEIT: ${{ github.event.client_payload.luftfeuchtigkeit || '--' }}
          WINDGESCHWINDIGKEIT: ${{ github.event.client_payload.windgeschwindigkeit || '--' }}
          BOENGESCHWINDIGKEIT: ${{ github.event.client_payload.boengeschwindigkeit || '--' }}
          WINDRICHTUNG: ${{ github.event.client_payload.windrichtung || '--' }}
          LUFTDRUCK: ${{ github.event.client_payload.druck || '--' }}
          UV_INDEX: ${{ github.event.client_payload.uv_index || '--' }}
          HELLIGKEIT: ${{ github.event.client_payload.beleuchtungsstarke || '--' }}
          REGEN_HEUTE: ${{ github.event.client_payload.regen_heute || '0.0' }}
          REGENVIERZEHNTAGE: ${{ github.event.client_payload.regenvierzehntage || '0.0' }}
          REGENMONAT: ${{ github.event.client_payload.regenmonat || '0.0' }}
          REGENJAHR: ${{ github.event.client_payload.regenjahr || '0.0' }}
          ZEIT: ${{ github.event.client_payload.zeit || 'Keine Aktualisierungszeit vorhanden' }}
        run: |
          python3 - <<'PY'
          import html
          import os
          from pathlib import Path

          def wert(name, standard):
              inhalt = os.environ.get(name, "").strip()

              if not inhalt:
                  inhalt = standard

              return html.escape(inhalt, quote=True)

          temperatur = wert("TEMPERATUR", "--")
          luftfeuchtigkeit = wert("LUFTFEUCHTIGKEIT", "--")
          windgeschwindigkeit = wert("WINDGESCHWINDIGKEIT", "--")
          boengeschwindigkeit = wert("BOENGESCHWINDIGKEIT", "--")
          windrichtung = wert("WINDRICHTUNG", "--")
          luftdruck = wert("LUFTDRUCK", "--")
          uv_index = wert("UV_INDEX", "--")
          helligkeit = wert("HELLIGKEIT", "--")
          regen_heute = wert("REGEN_HEUTE", "0.0")
          regen_vierzehn_tage = wert("REGENVIERZEHNTAGE", "0.0")
          regen_monat = wert("REGENMONAT", "0.0")
          regen_jahr = wert("REGENJAHR", "0.0")
          zeit = wert("ZEIT", "Keine Aktualisierungszeit vorhanden")

          links = chr(60)
          rechts = chr(62)

          def tag(name, inhalt="", attribute=""):
              attribut_text = f" {attribute}" if attribute else ""
              return (
                  f"{links}{name}{attribut_text}{rechts}"
                  f"{inhalt}"
                  f"{links}/{name}{rechts}"
              )

          def info_box(beschriftung, wert_text, zusaetzliche_attribute=""):
              label = tag("div", beschriftung, 'class="label"')
              value = tag("div", wert_text, 'class="value"')

              attribute = 'class="info"'
              if zusaetzliche_attribute:
                  attribute += f" {zusaetzliche_attribute}"

              return tag("div", label + value, attribute)

          kopf = "\n".join(
              [
                  f"{links}!DOCTYPE html{rechts}",
                  f'{links}html lang="de"{rechts}',
                  f"{links}head{rechts}",
                  f'  {links}meta charset="UTF-8"{rechts}',
                  (
                      f'  {links}meta name="viewport" '
                      f'content="width=device-width, initial-scale=1.0"{rechts}'
                  ),
                  (
                      f'  {links}meta name="description" '
                      f'content="Aktuelle Wetterdaten aus Steinach bei Rothenburg '
                      f'ob der Tauber"{rechts}'
                  ),
                  tag(
                      "title",
                      "Bastians Wetterstation | Steinach bei Rothenburg"
                  ),
                  (
                      f'  {links}link rel="stylesheet" '
                      f'href="css/style.css"{rechts}'
                  ),
                  f"{links}/head{rechts}",
              ]
          )

          wetter_boxen = "\n".join(
              [
                  info_box(
                      "💧 Luftfeuchtigkeit",
                      f"{luftfeuchtigkeit} %"
                  ),
                  info_box(
                      "🌬 Wind",
                      f"{windgeschwindigkeit} km/h"
                  ),
                  info_box(
                      "🌪 Böen",
                      f"{boengeschwindigkeit} km/h"
                  ),
                  info_box(
                      "🧭 Windrichtung",
                      windrichtung
                  ),
                  info_box(
                      "📈 Luftdruck",
                      f"{luftdruck} hPa"
                  ),
                  info_box(
                      "☀️ UV-Index",
                      uv_index
                  ),
                  info_box(
                      "💡 Helligkeit",
                      f"{helligkeit} lx"
                  ),
                  info_box(
                      "🌧 Regen heute",
                      f"{regen_heute} L/m²"
                  ),
                  info_box(
                      "📅 Regen 14 Tage",
                      f"{regen_vierzehn_tage} L/m²"
                  ),
                  info_box(
                      "📅 Regen Monat",
                      f"{regen_monat} L/m²"
                  ),
                  info_box(
                      "📅 Regen dieses Jahr",
                      f"{regen_jahr} L/m²",
                      'style="grid-column: span 2;"'
                  ),
              ]
          )

          projekt_link = tag(
              "a",
              "🌦 Wetterstation",
              'href="projekte/Wetterstation.html" class="projekt-link"'
          )

          projektbereich = tag(
              "div",
              tag("h2", "🚀 Weitere Projekte") + projekt_link,
              'class="projekte"'
          )

          hauptinhalt = "\n".join(
              [
                  tag("h1", "🌦 Bastians Wetterstation"),
                  tag(
                      "div",
                      "📍 Steinach bei Rothenburg ob der Tauber",
                      'class="ort"'
                  ),
                  tag(
                      "div",
                      f"{temperatur} °C",
                      'class="temp"'
                  ),
                  tag(
                      "div",
                      wetter_boxen,
                      'class="grid"'
                  ),
                  projektbereich,
                  tag(
                      "div",
                      f"🕒 {zeit}",
                      'class="stand"'
                  ),
              ]
          )

          html_datei = "\n".join(
              [
                  kopf,
                  f"{links}body{rechts}",
                  tag(
                      "main",
                      hauptinhalt,
                      'class="card"'
                  ),
                  f"{links}/body{rechts}",
                  f"{links}/html{rechts}",
                  "",
              ]
          )

          ziel = Path("public/index.html")
          ziel.write_text(html_datei, encoding="utf-8")

          print(f"HTML-Datei erstellt: {ziel}")
          print(f"Dateigröße: {ziel.stat().st_size} Bytes")
          PY

      - name: Erzeugte HTML-Datei prüfen
        run: |
          if [ ! -f "public/index.html" ]; then
            echo "Fehler: public/index.html wurde nicht erstellt."
            exit 1
          fi

          if [ ! -s "public/index.html" ]; then
            echo "Fehler: public/index.html ist leer."
            exit 1
          fi

          if grep -Fq '$TEMPERATUR' public/index.html; then
            echo "Fehler: TEMPERATUR wurde nicht ersetzt."
            exit 1
          fi

          if grep -Fq '$LUFTFEUCHTIGKEIT' public/index.html; then
            echo "Fehler: LUFTFEUCHTIGKEIT wurde nicht ersetzt."
            exit 1
          fi

          if grep -Fq '$REGENVIERZEHNTAGE' public/index.html; then
            echo "Fehler: REGENVIERZEHNTAGE wurde nicht ersetzt."
            exit 1
          fi

          if grep -Fq '$REGENMONAT' public/index.html; then
            echo "Fehler: REGENMONAT wurde nicht ersetzt."
            exit 1
          fi

          if grep -Fq '$REGENJAHR' public/index.html; then
            echo "Fehler: REGENJAHR wurde nicht ersetzt."
            exit 1
          fi

          if grep -Fq '$ZEIT' public/index.html; then
            echo "Fehler: ZEIT wurde nicht ersetzt."
            exit 1
          fi

          if grep -Fq '&lt;' public/index.html; then
            echo "Fehler: Die HTML-Tags wurden als &lt; gespeichert."
            exit 1
          fi

          if grep -Fq '&gt;' public/index.html; then
            echo "Fehler: Die HTML-Tags wurden als &gt; gespeichert."
            exit 1
          fi

          echo "Die HTML-Datei wurde erfolgreich geprüft."
          echo "Angezeigte Wetterwerte:"
          grep 'class="value"' public/index.html || true

      - name: GitHub Pages konfigurieren
        uses: actions/configure-pages@v5

      - name: Webseiten-Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
