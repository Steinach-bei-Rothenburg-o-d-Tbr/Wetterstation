name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"] # Falls dein Haupt-Branch "master" heißt, hier "master" eintragen
  workflow_dispatch: # Ermöglicht es dir, den Build manuell bei GitHub zu starten

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' # Lädt alle Dateien im Hauptverzeichnis hoch

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
