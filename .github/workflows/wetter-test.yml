name: TEST Wetter-Vorhersage

on:
  workflow_dispatch: 

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test-prognose:
    runs-on: ubuntu-latest
    steps:
      - name: Code auschecken
        uses: actions/checkout@v4

      - name: Test-Webseite mit Vorhersage bauen
        run: |
          cat > prognose-test.html << 'EOF'
          <!DOCTYPE html>
          <html lang="de">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>Test Vorhersage Steinach</title>
            <link rel="stylesheet" href="css/style.css">
          </head>
          <body>
            <div class="card">
              <h1>🔮 Wetterprognose Test</h1>
              <div class="ort">📍 Steinach bei Rothenburg o.d.Tbr.</div>
              
              <!-- Das echte, kompakte Wetter-Widget für deine Koordinaten -->
              <div style="width: 100%; max-width: 450px; margin: 20px auto; overflow: hidden; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <iframe 
                  src="https://open-meteo.com" 
                  style="width: 100%; height: 320px; border: none; display: block;">
                </iframe>
              </div>

              <div class="projekte" style="margin-top: 20px;">
                <a href="index.html" class="projekt-link">⬅️ Zurück zur Hauptseite</a>
              </div>
            </div>
          </body>
          </html>
          EOF

      - name: Webseiten-Ordner für Pages vorbereiten
        uses: actions/configure-pages@v5

      - name: Testseite im Repo speichern
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add prognose-test.html
          
          # Wir holen erst den aktuellen Stand der echten Wetterstation
          git fetch origin main
          git reset --soft origin/main
          
          # Speichern und mit Gewalt pushen, falls Home Assistant zeitgleich gesendet hat
          git diff --quiet && git diff --staged --quiet || (git commit -m "Test-Prognoseseite mit Force-Push" && git push --force origin main)

      - name: Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Auf GitHub Pages veröffentlichen
        uses: actions/deploy-pages@v4
